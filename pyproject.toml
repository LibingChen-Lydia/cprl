[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cprl"
version = "0.1.0"
description = "Adaptive conformal prediction for non-stationary time series forecasting."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "CPRL authors" }
]
keywords = [
  "conformal prediction",
  "time series forecasting",
  "uncertainty quantification",
  "adaptive calibration"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "sklearn-quantile>=0.1.0",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.65",
  "torch>=2.0",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
forecasting = [
  "einops>=0.7",
  "reformer-pytorch>=1.4",
  "PyWavelets>=1.5",
  "sympy>=1.12"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.urls]
Homepage = "https://github.com/LibingChen-Lydia/cprl"
Repository = "https://github.com/LibingChen-Lydia/cprl"
Issues = "https://github.com/LibingChen-Lydia/cprl/issues"

[tool.setuptools]
packages = [
  "src",
  "src.base_conformal",
  "exp",
  "data_provider",
  "utils",
  "time_series_library",
  "time_series_library.data_provider",
  "time_series_library.exp",
  "time_series_library.layers",
  "time_series_library.models",
  "time_series_library.utils"
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  ".git",
  ".venv",
  "venv",
  "results",
  "v_results",
  "all_results",
  "analysis_figures",
  "experiment_logs",
  "forecast_cache_seed*",
  "dataset",
  "Datasets",
  "time_series_library/dataset"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
